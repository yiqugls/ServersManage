<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>哨兵 · 服务器巡检</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V9l8-3z' fill='%230b0e14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 3l7 2.6v6.1c0 4.4-2.9 7.4-7 8.8-4.1-1.4-7-4.4-7-8.8V5.6L12 3z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">哨兵</div>
        <div class="brand-sub">SENTINEL OPS</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="#/" data-nav="overview">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>总览</span>
      </a>
      <a class="nav-item" href="#/alerts" data-nav="alerts">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4a6 6 0 00-6 6v4l-1.6 3h15.2L18 14v-4a6 6 0 00-6-6z"/><path d="M10 20a2 2 0 004 0"/></svg>
        <span>告警中心</span>
        <em id="navAlertCount" class="nav-badge" hidden></em>
      </a>
      <a class="nav-item" href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span>设置</span>
      </a>
    </nav>

    <div class="side-section">
      <div class="side-title"><span>服务器</span><span id="serverCount" class="side-count">0</span></div>
      <div id="serverList" class="server-list"></div>
    </div>

    <div class="side-foot">
      <div id="sideStatus" class="side-status">正在连接…</div>
      <div class="foot-meta"><span id="footVersion">v1.0.0</span><span id="footInterval">—</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">总览</h1>
        <p id="pageSub">所有服务器的健康状态</p>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<script src="/app.js"></script>
</body>
</html>
